<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Mata Pelajaran | GRADE MASTER</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/penugasan.css') }}">
</head>
<body>

    <main class="penugasan-container">

        <header class="halaman-header">
            <div>
                <h1>Ubah Mata Pelajaran</h1>
                <p>Ubah nama mata pelajaran yang Anda ajarkan.</p>
            </div>

            <a href="{{ url_for('daftar_mata_pelajaran') }}"
               class="btn-batal">
                Kembali
            </a>
        </header>

        {% if pesan %}
            <div class="toast-notification">
                {{ pesan }}
            </div>
        {% endif %}

        <section class="kartu-penugasan">

            <form method="POST">

                <label for="nama_mata_pelajaran">
                    Nama Mata Pelajaran
                </label>

                <input
                    type="text"
                    id="nama_mata_pelajaran"
                    name="nama_mata_pelajaran"
                    value="{{ mata_pelajaran.nama_mata_pelajaran }}"
                    placeholder="Masukkan nama mata pelajaran"
                    required
                >

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn-tambah">
                        Simpan
                    </button>

                    <a href="{{ url_for('daftar_mata_pelajaran') }}"
                       class="btn-batal">
                        Batal
                    </a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
