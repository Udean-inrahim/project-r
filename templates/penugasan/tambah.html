<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Penugasan | GRADE MASTER</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/penugasan.css') }}">
</head>
<body>

    <main class="penugasan-container">

        <header class="halaman-header">
            <h1>Tambah Penugasan</h1>
            <p>Masukkan mata pelajaran dan kelas awal yang Anda ajar.</p>
        </header>

        <form method="POST" class="form-penugasan">

            <div class="form-group">
                <label for="nama_mata_pelajaran">
                    Nama Mata Pelajaran
                </label>

                <input
                    type="text"
                    id="nama_mata_pelajaran"
                    name="nama_mata_pelajaran"
                    placeholder="Contoh: Informatika"
                    required
                >
            </div>

            <div class="form-group">
                <label for="kelas_awal">Kelas Awal</label>

                <input
                    type="text"
                    id="kelas_awal"
                    name="kelas_awal"
                    placeholder="Contoh: X"
                    required
                >
            </div>

            {% if pesan %}
                <p class="pesan-error">{{ pesan }}</p>
            {% endif %}

            <div class="form-actions">
                <a href="{{ url_for('daftar_penugasan') }}"
                   class="btn-batal">
                    Batal
                </a>

                <button type="submit" class="btn-simpan">
                    Simpan Penugasan
                </button>
            </div>

        </form>

    </main>

</body>
</html>
